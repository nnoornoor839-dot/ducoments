<script>
// نسخة قديمة من التطبيق كانت تسجّل عامل خدمة يخزّن الملفات، فتبقى الجوالات على نسخة قديمة
// بعد كل تحديث. هنا نلغي أي عامل خدمة قديم ونمسح مخزّنه مرة واحدة حتى تعمل التحديثات دائمًا.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(rs => Promise.all(rs.map(r => r.unregister())))
    .then(had => { if (had.some(Boolean) && window.caches) return caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(() => location.reload()); })
    .catch(() => {});
}
</script>
